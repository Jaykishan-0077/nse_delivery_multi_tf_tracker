name: NSE Delivery Multi-Timeframe Tracker (9:00 PM IST Cloud Runner)

on:
  schedule:
    # 9:00 PM IST is 15:30 UTC (Monday to Friday)
    - cron: '30 15 * * 1-5'
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  multi-tf-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Multi-TF Screener & Send Telegram + WhatsApp
        env:
          META_PHONE_NUMBER_ID: ${{ secrets.META_PHONE_NUMBER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          RECIPIENT_PHONE: ${{ secrets.RECIPIENT_PHONE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 whatsapp_notifier.py
